<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b18"><title>VORAX WHATSAPP CHECKER</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,#27e6e622,transparent 30%),radial-gradient(circle at 85% 80%,#8b5cf633,transparent 32%),linear-gradient(135deg,#050711,#10142b 55%,#080b18);color:#f5f7ff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:22px}.shell{width:min(100%,520px)}header{text-align:center;margin-bottom:22px}.logo{width:68px;height:68px;margin:auto auto 14px;border-radius:22px;display:grid;place-items:center;font-size:30px;font-weight:900;color:#07121b;background:linear-gradient(135deg,#27e6e6,#8afafa)}h1{font-size:clamp(23px,6vw,32px);letter-spacing:1.4px;margin:0}h1 span{color:#27e6e6}p{color:#9ca9c6;line-height:1.5}.card{background:#0f162be8;border:1px solid #27e6e655;border-radius:24px;padding:24px}label{display:block;margin-bottom:9px;font-size:13px}.field{display:flex;gap:9px;background:#080d1d;border:1px solid #34405f;border-radius:14px;padding:7px}select,input{background:transparent;color:white;border:0;outline:0;font:inherit}select{width:75px;color:#b9fafa}select option{color:#111}input{min-width:0;flex:1;padding:11px 5px}button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;background:linear-gradient(90deg,#27e6e6,#8cf5ed);font-weight:900}.result{display:none;margin-top:18px;padding:17px;background:#050a18;border:1px solid #34405f;border-radius:16px}.result.show{display:block}.status{font-weight:900;color:#ffd166}.note,.footer{text-align:center;font-size:12px;color:#8794b0}.footer{margin-top:18px}</style></head><body><main class="shell"><header><div class="logo">V</div><h1>VORAX <span>WHATSAPP</span> CHECKER</h1><p>Vérification du numéro · Sans inscription</p></header><section class="card"><label for="phone">NUMÉRO À ANALYSER</label><div class="field"><select id="country"><option value="CI">+225</option><option value="FR">+33</option><option value="SN">+221</option><option value="ML">+223</option><option value="BF">+226</option><option value="GH">+233</option><option value="NG">+234</option><option value="US">+1</option><option value="GB">+44</option></select><input id="phone" placeholder="Ex. 07 00 00 00 00" inputmode="tel"></div><button id="go">CHECKER LE NUMÉRO</button><div id="result" class="result" role="status"><div id="status" class="status"></div><div id="num"></div><p id="msg"></p></div><p class="note">Le site vérifie le format. Infobip sert uniquement au test de connexion API ; aucun statut de bannissement n'est inventé.</p></section><div class="footer">THE SUPREMARCY VORAX EMPIRE · VORAX TOOLS</div></main><script>
const $=id=>document.getElementById(id);$("go").onclick=async()=>{const phone=$("phone").value.trim();$("result").classList.remove("show");if(!phone){$("status").textContent="ERREUR";$("msg").textContent="Entre un numéro."; $("result").classList.add("show");return;}try{const r=await fetch("/api/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone,country:$("country").value})});const d=await r.json();$("status").textContent=d.label||"ERREUR";$("num").textContent=d.number?"Numéro : "+d.number:"";$("msg").textContent=d.message||d.error||"Erreur";$("result").classList.add("show");}catch{$("status").textContent="ERREUR";$("msg").textContent="Serveur indisponible";$("result").classList.add("show");}};
</script></body></html>
